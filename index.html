<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jak działa cło?</title>
<style>
:root{font-family:system-ui,sans-serif;color:#173536;background:#f4f5ef;line-height:1.6}*{box-sizing:border-box}body{margin:0}header,main,footer{max-width:1250px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;border-bottom:1px solid #d4dfd7}h1{font-size:clamp(2rem,4vw,3.7rem);line-height:1.13;margin:14px 0}h2{line-height:1.35;font-size:1.45rem}p{max-width:75ch}.eyebrow{font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:#526e64}.panel{background:white;border:1px solid #d4dfd7;border-radius:20px;padding:28px}.layout{display:grid;grid-template-columns:1.35fr 1fr;gap:22px;align-items:start}.intro{max-width:900px;margin:30px auto}.intro p{font-size:1.08rem}.author{border-left:3px solid #b89152;padding-left:20px;margin:30px 0;font-size:.95rem}button{font:inherit;cursor:pointer;border:1px solid #a8bdb5;border-radius:10px;padding:12px 18px;background:white;color:#173536}button:hover{background:#edf4ee}button:focus-visible,[role=button]:focus-visible{outline:3px solid #bd841b;outline-offset:3px}.primary{background:#175b51;color:white;border-color:#175b51}.primary:hover{background:#10453e}button:disabled{opacity:.45;cursor:default}.options{display:grid;gap:9px;margin:20px 0}.option{text-align:left}.option.selected{background:#deeee8;border:2px solid #175b51;padding:11px 17px}.option.correct{border:2px solid #157346;background:#e0f2e6}.option.wrong{border:2px solid #a63632;background:#fff0ed}.feedback{padding:18px;border-radius:12px;background:#edf4ef;margin:20px 0}.feedback.bad{background:#fff1eb}.muted{color:#526b65;font-size:.92rem}.progress{height:7px;background:#dce6df;border-radius:9px;margin:15px 0 25px}.progress div{height:100%;background:#b48a46;border-radius:9px}.actions{display:flex;gap:12px;flex-wrap:wrap}svg{width:100%;height:auto;display:block}.area{fill:#e5ece5;stroke:#708c80;stroke-width:1.5}.area.active{cursor:pointer}.area.active:hover{fill:#d6e8dd}.area.selected{fill:#d9b975;stroke:#885e1f;stroke-width:3}.area.correct{fill:#b1d9bf;stroke:#23723e;stroke-width:3}.area.wrong{fill:#f1b9ae;stroke:#a63632;stroke-width:3}.guide{stroke:#8b9c94;stroke-dasharray:6 6}.curve{stroke:#173c3b;stroke-width:3;fill:none}.price{stroke:#637974;stroke-width:2}.clickline{stroke:transparent;stroke-width:25;cursor:pointer}.target.selected .visible{stroke:#b78227;stroke-width:6}.target.correct .visible{stroke:#23723e;stroke-width:6}.target.wrong .visible{stroke:#a63632;stroke-width:6}svg text{font-family:system-ui;fill:#173536;font-size:20px}.letter{font-weight:bold;pointer-events:none}.point circle{fill:white;stroke:#456b60;stroke-width:2}.point.selected circle{fill:#d9b975}.point.correct circle{fill:#b1d9bf}.point.wrong circle{fill:#f1b9ae}footer{font-size:.83rem;color:#526b65}details{margin-top:16px}summary{cursor:pointer}ol li{margin:10px 0}[hidden]{display:none!important}@media(max-width:850px){.layout{grid-template-columns:1fr}.panel{padding:18px}main,header,footer{padding:16px}.intro{margin:10px auto}header{font-size:.85rem}}
.area-badge{fill:white;stroke:#456b60;stroke-width:2;pointer-events:none}[role="button"]{cursor:pointer}[role="button"]:hover circle{stroke:#b78227;stroke-width:3}.point.selected circle{stroke:#885e1f;stroke-width:3}.point.correct circle{stroke:#23723e;stroke-width:3}.point.wrong circle{stroke:#a63632;stroke-width:3}.numeric-menu{margin:30px 0}.example{display:block;width:100%;text-align:left;margin:12px 0;padding:20px;background:#f5f7f1}#number-answer{display:block;font:inherit;font-size:1.4rem;width:100%;padding:14px;border:2px solid #708c80;border-radius:10px;margin:10px 0}#numeric-error{color:#a63632}input:focus-visible{outline:3px solid #bd841b;outline-offset:3px}</style></head><body><header><strong>Jak działa cło?</strong></header><main id="app"></main><footer>Opracowanie: dr Aleksandra Nacewska-Twardowska · Uniwersytet Łódzki</footer>
<script>
const affiliation='<strong>Opracowanie: dr Aleksandra Nacewska-Twardowska</strong><br>Katedra Biznesu i Handlu Międzynarodowego<br>Wydział Ekonomiczno-Socjologiczny<br>Uniwersytet Łódzki';
const Q=[
['line','Wskaż krzywą podaży krajowej.',['s'],'Podaż krajowa to krzywa rosnąca. Wyższa cena zachęca krajowych producentów do zwiększenia produkcji.'],
['line','Wskaż cenę krajową przed wprowadzeniem cła.',['pw'],'Przy wolnym handlu cena krajowa jest równa cenie światowej.'],
['line','Wskaż cenę krajową po wprowadzeniu cła.',['pt'],'W tym modelu cena krajowa rośnie do poziomu ceny światowej powiększonej o cło na jednostkę dobra.'],
['choice','Co przedstawia pionowa odległość między obiema liniami cen?',['a'],'To cło na jednostkę importowanego dobra. Nie jest to dochód państwa: ten zależy również od wielkości importu.',[['a','Cło na jednostkę importowanego dobra'],['b','Łączny dochód państwa z cła'],['c','Spadek importu'],['d','Nadwyżka producentów przed cłem']]],
['point','Wskaż wielkość produkcji krajowej przed wprowadzeniem cła.',['A'],'Przecięcie ceny światowej z podażą wyznacza produkcję A. Po wprowadzeniu cła produkcja wzrasta do B.'],
['point','Wskaż wielkość konsumpcji krajowej po wprowadzeniu cła.',['C'],'Przecięcie ceny z cłem z popytem wyznacza konsumpcję C. Przed cłem konsumpcja wynosiła D.'],
['segment','Zaznacz odcinek przedstawiający import przed wprowadzeniem cła.',['AD'],'Import to konsumpcja minus produkcja krajowa. Przed cłem jest to D − A, czyli odcinek A–D.'],
['segment','Zaznacz odcinek przedstawiający import po wprowadzeniu cła.',['BC'],'Po wprowadzeniu cła konsumpcja wynosi C, a produkcja krajowa B. Import to C − B, czyli odcinek B–C.'],
['segment','Zaznacz odcinek przedstawiający wzrost produkcji krajowej.',['AB'],'Produkcja krajowa rośnie z A do B. Przyrost przedstawia odcinek A–B.'],
['segment','Zaznacz odcinek przedstawiający spadek konsumpcji krajowej.',['CD'],'Konsumpcja maleje z D do C. Wielkość spadku przedstawia odcinek C–D.'],
['area','Zaznacz pole przedstawiające nadwyżkę producentów krajowych przed wprowadzeniem cła.',['W'],'W to trójkąt pomiędzy ceną światową, krzywą podaży i osią ceny. Przedstawia nadwyżkę producentów przy wolnym handlu.'],
['area','Zaznacz pole przedstawiające wzrost nadwyżki producentów krajowych.',['X'],'Trapez X przedstawia przyrost nadwyżki producentów dzięki wzrostowi ceny. Nie jest to cała nadwyżka po wprowadzeniu cła.'],
['area','Zaznacz wszystkie pola składające się na nadwyżkę producentów krajowych po wprowadzeniu cła.',['W','X'],'Po wprowadzeniu cła nadwyżka producentów wynosi W + X: nadwyżka początkowa plus jej przyrost.'],
['area','Zaznacz pole przedstawiające dochody budżetu państwa z cła.',['Z'],'Prostokąt Z ma wysokość równą cłu na jednostkę i szerokość równą importowi po cle (B–C). Dochód państwa to ich iloczyn.'],
['area','Zaznacz wszystkie pola składające się na spadek nadwyżki konsumentów.',['X','Y','Z','V'],'Konsumenci tracą X + Y + Z + V. Część tej straty przejmują producenci (X) i państwo (Z), a Y + V stanowi stratę dobrobytu netto.'],
['area','Zaznacz wszystkie pola przedstawiające stratę dobrobytu całej gospodarki.',['Y','V'],'Y to strata dobrobytu związana z nieefektywną alokacją zasobów wytwórczych: import jest zastępowany droższą produkcją krajową. V to strata dobrobytu związana z ograniczeniem konsumpcji: konsumenci rezygnują z jednostek, których korzyść przewyższa cenę światową. X i Z są transferami wewnątrz gospodarki.'],
['choice','Dlaczego spadek importu jest większy niż sam wzrost produkcji krajowej?',['b'],'Import maleje z dwóch powodów: kraj produkuje więcej (A–B), a konsumenci kupują mniej (C–D). Spadek importu jest sumą obu odcinków.',[['a','Ponieważ całe cło trafia do producentów'],['b','Ponieważ równocześnie maleje konsumpcja krajowa'],['c','Ponieważ cena światowa rośnie'],['d','Ponieważ po cle import zawsze zanika']]],
['choice','Dlaczego strata konsumentów jest większa niż strata dobrobytu całej gospodarki?',['c'],'X trafia do producentów krajowych, a Z do budżetu państwa. Po uwzględnieniu tych korzyści strata dobrobytu kraju wynosi Y + V.',[['a','Ponieważ konsumenci nie płacą wyższej ceny'],['b','Ponieważ państwo przekazuje całe cło zagranicy'],['c','Ponieważ część straty konsumentów przejmują producenci i państwo'],['d','Ponieważ nadwyżka producentów maleje']]]
];
const names={s:'M',d:'N',pw:'P₁',pt:'P₂',AB:'A–B',BC:'B–C',CD:'C–D',AD:'A–D'};
let queue=[],pos=0,selected=new Set(),checked=false,answers=[],review=false;
const app=document.querySelector('#app');
function start(ids=Q.map((_,i)=>i),isReview=false){queue=ids;pos=0;answers=[];review=isReview;render()}
function intro(){app.innerHTML=`<section class="panel intro"><div class="eyebrow">Interaktywne ćwiczenie · 18 pytań</div><h1>Jak działa cło?</h1><p>Odkryj, jak cło zmienia produkcję, konsumpcję, import i dobrobyt. Zaznaczaj elementy wykresu i sprawdzaj odpowiedzi krok po kroku.</p><div class="author">${affiliation}</div><p><strong>Model:</strong> mała gospodarka importująca dobro, stała cena światowa, konkurencja doskonała. Cło na jednostkę podnosi cenę krajową, ale nie eliminuje importu. Pomijamy inne podatki i efekty zewnętrzne.</p><p>Oznaczenia w kółkach ułatwiają wybór elementów. W każdym pytaniu aktywna jest odpowiednia grupa: krzywe i ceny, ilości albo pola. Możesz też użyć przycisków pod pytaniem. W pytaniach o pola możesz zaznaczyć kilka liter. Odpowiedź zatwierdź przyciskiem „Sprawdź odpowiedź”.</p><button class="primary" id="start">Rozpocznij ćwiczenie</button><p class="muted">Bez logowania. Wynik pozostaje w tej karcie przeglądarki; odświeżenie rozpoczyna ćwiczenie od nowa.</p></section>`;document.querySelector('#start').onclick=()=>start()}
function keys(q){return q[0]==='line'?['s','d','pw','pt']:q[0]==='point'?['A','B','C','D']:q[0]==='segment'?['AB','BC','CD','AD']:['W','X','Y','Z','V']}
function cls(k){if(!checked)return selected.has(k)?'selected':'';return Q[queue[pos]][2].includes(k)?'correct':selected.has(k)?'wrong':''}
function graph(q){const mode=q[0];const badge=(k,x,y,m)=>`<g class="point ${mode===m?cls(k):''}" ${active(m,k)}><circle cx="${x}" cy="${y}" r="21"/><text class="letter" text-anchor="middle" x="${x}" y="${y+7}">${names[k]||k}</text></g>`;const active=(m,k)=>mode===m?`role="button" tabindex="0" data-key="${k}" aria-label="${names[k]||k}" aria-pressed="${selected.has(k)}"`:'';
const line=(k,x1,y1,x2,y2,base)=>`<g class="target ${cls(k)}" ${active('line',k)}><line class="visible ${base}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>${mode==='line'?`<line class="clickline" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`:''}</g>`;
return `<svg viewBox="0 0 950 690" aria-labelledby="chartTitle chartDesc"><title id="chartTitle">Rynek dobra importowanego przed cłem i po jego wprowadzeniu</title><desc id="chartDesc">Krzywe M i N oraz poziomy cen P₁ i P₂. Na osi ilości kolejno A, B, C, D. Te same odpowiedzi można wybrać przyciskami obok wykresu.</desc><text x="24" y="65">Cena</text><text x="795" y="572">Ilość</text><path d="M120 55V540H910" fill="none" stroke="#173536" stroke-width="2"/>
${[['W','120,400 280,400 120,480',170,440],['X','120,340 400,340 280,400 120,400',245,378],['Y','280,400 400,340 400,400',365,389],['Z','400,340 600,340 600,400 400,400',495,378],['V','600,340 720,400 600,400',625,389]].map(([k,p,x,y])=>`<g ${active('area',k)}><polygon class="area ${mode==='area'?'active':''} ${cls(k)}" points="${p}"/><circle class="area-badge" cx="${x}" cy="${y-7}" r="20"/><text class="letter" text-anchor="middle" x="${x}" y="${y}">${k}</text></g>`).join('')}
${[['A',280,400],['B',400,340],['C',600,340],['D',720,400]].map(([k,x,y])=>`<line class="guide" x1="${x}" y1="${y}" x2="${x}" y2="540"/>`).join('')}
${line('s',120,480,880,100,'curve')}${line('d',120,100,880,480,'curve')}${line('pw',120,400,880,400,'price')}${line('pt',120,340,880,340,'price')}
${badge('s',820,112,'line')}${badge('d',820,478,'line')}${badge('pw',120,400,'line')}${badge('pt',120,340,'line')}
${[['A',280],['B',400],['C',600],['D',720]].map(([k,x])=>`<g class="point ${mode==='point'?cls(k):''}" ${active('point',k)}><circle cx="${x}" cy="540" r="21"/><text class="letter" text-anchor="middle" x="${x}" y="548">${k}</text></g>`).join('')}
${mode==='segment'?[['AB',280,400,595],['BC',400,600,625],['CD',600,720,595],['AD',280,720,660]].map(([k,a,b,y])=>`<g class="target ${cls(k)}" ${active('segment',k)}><path class="visible" d="M${a} ${y-6}V${y}H${b}V${y-6}" stroke="#617c70" stroke-width="3" fill="none"/><line class="clickline" x1="${a}" y1="${y}" x2="${b}" y2="${y}"/><text class="letter" text-anchor="middle" x="${(a+b)/2}" y="${y-10}">${names[k]}</text></g>`).join(''):''}</svg>`}
function render(){selected=new Set();checked=false;draw();document.querySelector('#question').focus({preventScroll:true});window.scrollTo({top:0,left:0,behavior:'instant'})}
function draw(){const q=Q[queue[pos]],multi=q[0]==='area';app.innerHTML=`<div class="eyebrow">${review?'Powtórka':'Ćwiczenie'} · pytanie ${pos+1} z ${queue.length}</div><div class="progress" role="progressbar" aria-label="Postęp ćwiczenia" aria-valuemin="0" aria-valuemax="${queue.length}" aria-valuenow="${pos}"><div style="width:${pos/queue.length*100}%"></div></div><div class="layout"><section class="panel">${graph(q)}<p class="muted">Schemat bez skali liczbowej. M, N: krzywe. P₁, P₂: ceny. A–D: ilości. W, X, Y, Z, V: pola.</p><details><summary>Założenia modelu</summary><p>Mała gospodarka, stała cena światowa, konkurencja doskonała, brak efektów zewnętrznych. Cena krajowa rośnie o cło na jednostkę. Import po cle pozostaje dodatni.</p></details></section><section class="panel"><h2 id="question" tabindex="-1">${q[1]}</h2><p class="muted">${multi?'Możesz zaznaczyć kilka pól. Ponowne kliknięcie usuwa zaznaczenie.':q[0]==='choice'?'Wybierz jedną odpowiedź.':'Kliknij element wykresu lub wybierz przycisk poniżej.'}</p><div class="options">${(q[0]==='choice'?q[4]:keys(q).map(k=>[k,names[k]||k])).map(([k,label])=>`<button class="option ${cls(k)}" data-key="${k}" aria-pressed="${selected.has(k)}" ${checked?'disabled':''}>${label}${checked&&q[2].includes(k)?' ✓':''}${checked&&selected.has(k)&&!q[2].includes(k)?' ✕':''}</button>`).join('')}</div><div id="feedback" aria-live="polite">${checked?`<div class="feedback ${isCorrect(q)?'':'bad'}"><strong>${isCorrect(q)?'Poprawna odpowiedź.':'To nie jest pełna poprawna odpowiedź.'}</strong><p>Twój wybór: ${[...selected].map(k=>label(q,k)).join(' + ')}<br>Poprawna odpowiedź: ${q[2].map(k=>label(q,k)).join(' + ')}</p><p>${q[3]}</p><small>✓ Zielony: poprawny element. ✕ Czerwony: błędnie zaznaczony element.</small></div>`:''}</div><div class="actions"><button class="primary" id="check" ${!selected.size?'disabled':''}>${checked?(pos===queue.length-1?'Zobacz wynik':'Następne pytanie'):'Sprawdź odpowiedź'}</button><button id="home">Ekran startowy</button></div></section></div>`;
app.querySelectorAll('[data-key]').forEach(el=>{el.onclick=()=>choose(el.dataset.key);if(el.tagName.toLowerCase()==='g')el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();choose(el.dataset.key)}}});
document.querySelector('#check').onclick=()=>{if(!checked){checked=true;answers.push({id:queue[pos],ok:isCorrect(q),picked:[...selected]});draw();document.querySelector('#check').focus()}else if(pos<queue.length-1){pos++;render()}else finish()};document.querySelector('#home').onclick=()=>{if(confirm('Wrócić do początku? Wynik bieżącej rundy zostanie usunięty.'))intro()}}
function label(q,k){return q[0]==='choice'?q[4].find(x=>x[0]===k)[1]:names[k]||k}
function choose(k){if(checked)return;const q=Q[queue[pos]];if(q[0]==='area'){selected.has(k)?selected.delete(k):selected.add(k)}else selected=new Set([k]);draw();app.querySelector(`button[data-key="${k}"]`)?.focus()}
function isCorrect(q){return selected.size===q[2].length&&q[2].every(k=>selected.has(k))}
function finish(){const good=answers.filter(a=>a.ok).length,miss=answers.filter(a=>!a.ok).map(a=>a.id);app.innerHTML=`<section class="panel intro"><div class="eyebrow">${review?'Powtórka zakończona':'Ćwiczenie zakończone'}</div><h1>${good} / ${queue.length}</h1><p>Poprawne odpowiedzi: ${Math.round(good/queue.length*100)}%. Wynik dotyczy ${review?'tej powtórki':'pierwszych odpowiedzi w tej rundzie'}.</p><p>${miss.length?'Wróć do trudniejszych pytań i utrwal mechanizm działania cła.':'Wszystkie odpowiedzi są poprawne. Potrafisz rozróżnić poziomy nadwyżek, ich zmiany i stratę dobrobytu.'}</p><div class="actions">${miss.length?'<button class="primary" id="retry">Powtórz błędne odpowiedzi</button>':''}<button id="again">Rozpocznij wszystkie 18 pytań</button></div><details><summary>Przejrzyj odpowiedzi z tej rundy</summary><ol>${answers.map(a=>`<li><strong>${a.ok?'✓':'✕'} ${Q[a.id][1]}</strong><br>Twój wybór: ${a.picked.map(k=>label(Q[a.id],k)).join(' + ')}<br>Poprawnie: ${Q[a.id][2].map(k=>label(Q[a.id],k)).join(' + ')}<br>${Q[a.id][3]}</li>`).join('')}</ol></details><div class="author">${affiliation}</div></section>`;document.querySelector('#again').onclick=()=>start();if(miss.length)document.querySelector('#retry').onclick=()=>start(miss,true);window.scrollTo(0,0)}
const originalIntro=intro;
intro=function(){originalIntro();document.querySelector('.eyebrow').textContent='Wybierz ćwiczenie';document.querySelector('#start').textContent='Rozpoznawanie wykresu · 18 pytań';const menu=document.createElement('div');menu.className='numeric-menu';menu.innerHTML='<h2>Przykłady liczbowe</h2><p>Oblicz import, zmiany produkcji i konsumpcji oraz pola W, X, Y, Z i V. Każdy przykład ma osobny wynik.</p>'+EXAMPLES.map((e,i)=>`<button class="example" data-example="${i}"><strong>Przykład ${i+1} · ${(i===0?'Z podpowiedziami':'Samodzielnie')}</strong><br><span class="muted">Cena przed cłem: ${e.p} zł/szt. · po cle: ${e.pt} zł/szt.</span></button>`).join('');document.querySelector('#start').after(menu);menu.querySelectorAll('[data-example]').forEach(b=>b.onclick=()=>numericStart(Number(b.dataset.example)));window.scrollTo({top:0,left:0,behavior:'instant'})};
const EXAMPLES=[{p:10,pt:15,A:4,B:6,C:10,D:12,p0:0},{p:8,pt:12,A:4,B:8,C:12,D:16,p0:4},{p:10,pt:12,A:4,B:6,C:12,D:14,p0:6},{p:8,pt:12,A:4,B:8,C:12,D:14,p0:4},{p:8,pt:12,A:4,B:6,C:10,D:14,p0:0}];
function numericQuestions(e){const t=e.pt-e.p,W=(e.p-e.p0)*e.A/2,X=(e.A+e.B)*t/2,Y=(e.B-e.A)*t/2,Z=(e.C-e.B)*t,V=(e.D-e.C)*t/2;return [
['Ile wynosi produkcja krajowa przed wprowadzeniem cła?',e.A,'szt.','A',`Odczyt z osi: A = ${e.A} szt.`, 'Odczytaj ilość w punkcie A.'],
['Ile wynosi produkcja krajowa po wprowadzeniu cła?',e.B,'szt.','s',`Odczyt z osi: B = ${e.B} szt.`, 'Odczytaj ilość w punkcie B.'],
['Ile wynosi konsumpcja krajowa przed wprowadzeniem cła?',e.D,'szt.','d',`Odczyt z osi: D = ${e.D} szt.`, 'Odczytaj ilość w punkcie D.'],
['Ile wynosi konsumpcja krajowa po wprowadzeniu cła?',e.C,'szt.','C',`Odczyt z osi: C = ${e.C} szt.`, 'Odczytaj ilość w punkcie C.'],
['Ile wynosi cło na jednostkę dobra?',t,'zł/szt.','t',`P₂ − P₁ = ${e.pt} − ${e.p} = ${t} zł/szt.`, 'Od ceny z cłem odejmij cenę światową.'],
['Ile wynosi import przed wprowadzeniem cła?',e.D-e.A,'szt.','AD',`D − A = ${e.D} − ${e.A} = ${e.D-e.A} szt. Import pokrywa różnicę między konsumpcją a produkcją krajową.`, 'Import przed cłem = D − A.'],
['Ile wynosi import po wprowadzeniu cła?',e.C-e.B,'szt.','BC',`C − B = ${e.C} − ${e.B} = ${e.C-e.B} szt.`, 'Import po cle = C − B.'],
['O ile zmniejsza się import?',e.D-e.A-e.C+e.B,'szt.','imports',`(${e.D} − ${e.A}) − (${e.C} − ${e.B}) = ${e.D-e.A-e.C+e.B} szt. Spadek importu obejmuje wzrost produkcji i spadek konsumpcji.`, 'Od importu przed cłem odejmij import po cle.'],
['O ile zwiększa się produkcja krajowa?',e.B-e.A,'szt.','AB',`B − A = ${e.B} − ${e.A} = ${e.B-e.A} szt.`, 'Wzrost produkcji = B − A.'],
['O ile zmniejsza się konsumpcja krajowa?',e.D-e.C,'szt.','CD',`D − C = ${e.D} − ${e.C} = ${e.D-e.C} szt.`, 'Spadek konsumpcji = D − C.'],
['Ile wynosi nadwyżka producentów krajowych przed wprowadzeniem cła?',W,'zł','W',`W = A × (P₁ − P₀) ÷ 2 = ${e.A} × (${e.p} − ${e.p0}) ÷ 2 = ${W} zł. P₀ to cena na przecięciu podaży z osią ceny.`, 'To pole W. Trójkąt W: podstawa A, wysokość P₁ − P₀. Pole = podstawa × wysokość ÷ 2.'],
['O ile wzrasta nadwyżka producentów krajowych po wprowadzeniu cła?',X,'zł','X',`X = (A + B) × (P₂ − P₁) ÷ 2 = (${e.A} + ${e.B}) × ${t} ÷ 2 = ${X} zł.`, 'To pole X. Trapez X: równoległe podstawy A i B, wysokość równa cłu jednostkowemu.'],
['Ile wynosi strata dobrobytu związana z nieefektywną alokacją zasobów wytwórczych?',Y,'zł','Y',`Y = (B − A) × (P₂ − P₁) ÷ 2 = (${e.B} − ${e.A}) × ${t} ÷ 2 = ${Y} zł. To strata dobrobytu związana z nieefektywną alokacją zasobów wytwórczych.`, 'To pole Y, czyli strata dobrobytu związana z nieefektywną alokacją zasobów wytwórczych. Trójkąt Y: podstawa B − A, wysokość równa cłu jednostkowemu.'],
['Ile wynoszą dochody budżetu państwa z cła?',Z,'zł','Z',`Z = (C − B) × (P₂ − P₁) = (${e.C} − ${e.B}) × ${t} = ${Z} zł. Cło pobiera się od importu pozostałego po jego wprowadzeniu.`, 'To pole Z. Prostokąt Z: import po cle × cło na jednostkę.'],
['Ile wynosi strata dobrobytu związana z ograniczeniem konsumpcji?',V,'zł','V',`V = (D − C) × (P₂ − P₁) ÷ 2 = (${e.D} − ${e.C}) × ${t} ÷ 2 = ${V} zł. To strata dobrobytu związana z ograniczeniem konsumpcji.`, 'To pole V, czyli strata dobrobytu związana z ograniczeniem konsumpcji. Trójkąt V: podstawa D − C, wysokość równa cłu jednostkowemu.'],
['Ile wynosi cała nadwyżka producentów po wprowadzeniu cła?',W+X,'zł','WX',`W + X = ${W} + ${X} = ${W+X} zł. Dodajemy początkową nadwyżkę i jej przyrost.`, 'Dodaj pola W i X.'],
['Ile wynosi spadek nadwyżki konsumentów?',X+Y+Z+V,'zł','XYZV',`X + Y + Z + V = ${X} + ${Y} + ${Z} + ${V} = ${X+Y+Z+V} zł.`, 'Dodaj pola X, Y, Z i V.'],
['Ile wynosi strata dobrobytu całej gospodarki?',Y+V,'zł','YV',`Y + V = ${Y} + ${V} = ${Y+V} zł. X i Z są transferami wewnątrz kraju, dlatego nie wchodzą do straty netto.`, 'Dodaj dwa trójkąty strat: Y i V.']
]}
let exampleId=0,nquestions=[],nqueue=[],nindex=0,nanswers=[],nchecked=false,nvalue='',nretry=false;
function numericStart(id,ids=null){exampleId=id;nquestions=numericQuestions(EXAMPLES[id]);nqueue=ids||nquestions.map((_,i)=>i);nindex=0;nanswers=[];nretry=!!ids;numericNext()}
function numericNext(){nchecked=false;nvalue='';numericDraw();document.querySelector('#number-question').focus({preventScroll:true});window.scrollTo({top:0,left:0,behavior:'instant'})}
function numericGraph(e,focus){const xx=q=>120+q/e.D*650,yy=p=>530-p/(e.pt*1.65)*450,poly=pts=>pts.map(([q,p])=>`${xx(q)},${yy(p)}`).join(' '),t=e.pt-e.p,slope=(e.B-e.A)/t,sd=(e.D-e.C)/t,pmax=e.pt*1.55,coords={W:[[0,e.p],[e.A,e.p],[0,e.p0]],X:[[0,e.pt],[e.B,e.pt],[e.A,e.p],[0,e.p]],Y:[[e.A,e.p],[e.B,e.pt],[e.B,e.p]],Z:[[e.B,e.pt],[e.C,e.pt],[e.C,e.p],[e.B,e.p]],V:[[e.C,e.pt],[e.D,e.p],[e.C,e.p]]};const marker=(x,y,label)=>`<g><circle cx="${x}" cy="${y}" r="20" fill="white" stroke="#456b60" stroke-width="2"/><text text-anchor="middle" x="${x}" y="${y+7}" class="letter">${label}</text></g>`;
return `<svg viewBox="0 0 950 700" aria-label="Wykres liczbowy przykładu ${exampleId+1}"><text x="12" y="38">Cena (zł/szt.)</text><text x="735" y="688">Ilość (szt.)</text><path d="M120 45V530H910" fill="none" stroke="#173536" stroke-width="2"/>
${Object.entries(coords).map(([k,p])=>`<polygon points="${poly(p)}" fill="${focus.includes(k)?'#b1d9bf':'#e5ece5'}" stroke="${focus.includes(k)?'#23723e':'#8ba294'}" stroke-width="${focus.includes(k)?3:1}"/>`).join('')}
<path d="M${xx(0)} ${yy(e.p0)}L${xx(Math.min(e.D*1.1,(pmax-e.p0)*slope))} ${yy(Math.min(pmax,e.p0+e.D*1.1/slope))}" class="curve"/>
<path d="M${xx(Math.max(0,e.D-(pmax-e.p)*sd))} ${yy(Math.min(pmax,e.p+e.D/sd))}L${xx(e.D*1.1)} ${yy(Math.max(0,e.p-e.D*.1/sd))}" class="curve"/>
<path d="M120 ${yy(e.p)}H900M120 ${yy(e.pt)}H900" class="price"/>
${[['A',e.A,e.p],['B',e.B,e.pt],['C',e.C,e.pt],['D',e.D,e.p]].map(([k,q,p])=>`<path d="M${xx(q)} ${yy(p)}V530" class="guide"/>${marker(xx(q),530,k)}<text text-anchor="middle" x="${xx(q)}" y="574">${q}</text>`).join('')}
${marker(120,yy(e.p),'P₁')}${marker(120,yy(e.pt),'P₂')}<text text-anchor="end" x="85" y="${yy(e.p)+7}">${e.p}</text><text text-anchor="end" x="85" y="${yy(e.pt)+7}">${e.pt}</text><text text-anchor="end" x="108" y="${yy(e.p0)+7}">P₀ = ${e.p0}</text>
${Object.entries(coords).map(([k,pts])=>{let q=pts.reduce((a,p)=>a+p[0],0)/pts.length,p=pts.reduce((a,c)=>a+c[1],0)/pts.length;return marker(xx(q),yy(p),k)}).join('')}
${marker(xx(Math.min(e.D*.95,(e.pt*1.4-e.p0)*slope)),yy(e.p0+Math.min(e.D*.95,(e.pt*1.4-e.p0)*slope)/slope)-25,'M')}${marker(xx(e.D*.95),yy(e.p+(e.D-e.D*.95)/sd)+35,'N')}
<text x="140" y="620">P₁ = cena przed cłem · P₂ = cena po cle</text><text x="140" y="654">P₀ = cena przy zerowej podaży krajowej</text></svg>`}
function numericDraw(){const e=EXAMPLES[exampleId],q=nquestions[nqueue[nindex]],result=nanswers[nanswers.length-1];app.innerHTML=`<div class="eyebrow">Przykład ${exampleId+1}${nretry?' · powtórka':''} · pytanie ${nindex+1} z ${nqueue.length}</div><div class="progress"><div style="width:${nindex/nqueue.length*100}%"></div></div><div class="layout"><section class="panel">${numericGraph(e,nchecked?q[3]:'')}<p class="muted">Wykres i wartości dotyczą wyłącznie tego przykładu. M: podaż, N: popyt. Mała gospodarka importująca dobro; stała cena światowa, liniowe krzywe, brak efektów zewnętrznych. Pola mierzymy w zł.</p></section><section class="panel"><h2 id="number-question" tabindex="-1">${q[0]}</h2><form id="numeric-form"><label for="number-answer">Twoja odpowiedź (${q[2]})</label><input id="number-answer" type="text" inputmode="decimal" autocomplete="off" placeholder="Wpisz liczbę" ${nchecked?'disabled':''} aria-describedby="numeric-error"><p id="numeric-error" role="alert"></p>${exampleId===0&&!nchecked?`<details><summary>Pokaż podpowiedź</summary><p>${q[5]}</p></details>`:''}<div aria-live="polite">${nchecked?`<div class="feedback ${result.ok?'':'bad'}"><strong>${result.ok?'Poprawna odpowiedź.':'Sprawdź sposób obliczenia.'}</strong><p>Twój wynik: ${result.value} ${q[2]}<br>Poprawny wynik: ${q[1]} ${q[2]}</p><p>${q[4]}</p></div>`:''}</div><div class="actions" style="margin-top:20px"><button class="primary" type="submit">${nchecked?(nindex===nqueue.length-1?'Zobacz wynik':'Następne pytanie'):'Sprawdź odpowiedź'}</button><button type="button" id="numeric-menu">Wybór ćwiczenia</button></div></form></section></div>`;document.querySelector('#number-answer').value=nvalue;document.querySelector('#numeric-menu').onclick=()=>{if(confirm('Wrócić do wyboru ćwiczenia? Wynik bieżącej rundy zostanie usunięty.'))intro()};document.querySelector('#numeric-form').onsubmit=event=>{event.preventDefault();if(nchecked){if(nindex<nqueue.length-1){nindex++;numericNext()}else numericFinish();return}const raw=document.querySelector('#number-answer').value.trim();if(!/^\d+(?:[.,]\d+)?$/.test(raw)){document.querySelector('#numeric-error').textContent='Wpisz nieujemną liczbę, bez jednostki. Możesz użyć przecinka lub kropki.';return}const value=Number(raw.replace(',','.'));if(!Number.isFinite(value)){document.querySelector('#numeric-error').textContent='Wpisz skończoną liczbę.';return}nvalue=raw;nanswers.push({id:nqueue[nindex],value,ok:Math.abs(value-q[1])<1e-8});nchecked=true;numericDraw();document.querySelector('#numeric-form button[type="submit"]').focus()}}
function numericFinish(){const good=nanswers.filter(a=>a.ok).length,miss=nanswers.filter(a=>!a.ok).map(a=>a.id);app.innerHTML=`<section class="panel intro"><div class="eyebrow">Przykład ${exampleId+1} · ${nretry?'wynik powtórki':'wynik'}</div><h1>${good} / ${nqueue.length}</h1><p>Poprawne pierwsze odpowiedzi w tej rundzie: ${Math.round(good/nqueue.length*100)}%.</p><div class="actions">${miss.length?'<button class="primary" id="numeric-retry">Powtórz błędne odpowiedzi</button>':''}<button id="numeric-again">Powtórz cały przykład</button><button id="numeric-home">Wybór ćwiczenia</button></div><details><summary>Rozwiązania z tej rundy</summary><ol>${nanswers.map(a=>`<li><strong>${a.ok?'✓':'✕'} ${nquestions[a.id][0]}</strong><br>Twój wynik: ${a.value} ${nquestions[a.id][2]}<br>${nquestions[a.id][4]}</li>`).join('')}</ol></details><div class="author">${affiliation}</div></section>`;document.querySelector('#numeric-again').onclick=()=>numericStart(exampleId);document.querySelector('#numeric-home').onclick=intro;if(miss.length)document.querySelector('#numeric-retry').onclick=()=>numericStart(exampleId,miss);window.scrollTo({top:0,left:0,behavior:'instant'})}
const oldFinish=finish;finish=function(){oldFinish();const b=document.createElement('button');b.textContent='Wybór ćwiczenia';b.onclick=intro;document.querySelector('.actions').append(b)};

intro();
</script></body></html>
